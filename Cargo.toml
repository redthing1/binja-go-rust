[package]
name = "binja-go-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
description = "Go and Rust analysis for Binary Ninja"

[lib]
crate-type = ["cdylib"]

[dependencies]
binaryninja = { git = "https://github.com/Vector35/binaryninja-api", rev = "775c3b5eed8598217b20e1087afe7aa092a9b4b1" }
binaryninjacore-sys = { git = "https://github.com/Vector35/binaryninja-api", rev = "775c3b5eed8598217b20e1087afe7aa092a9b4b1" }
libloading = "=0.8.9"
unstrip = { git = "https://github.com/riven-labs/unstrip", rev = "ff3bba3a96fe00b744be166fb31c0b85db0ef82f" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
